# Producao (adaptado do qrcode, sem MySQL — a BD e SQLite local).
#
# Persistencia: o SQLite de producao vive DENTRO do bind-mount storage/
# (DB_DATABASE=/app/storage/database/database.sqlite no .env do servidor).
# Trocar a imagem nunca toca na BD; os backups diarios (db:backup) caem em
# storage/backups no host. NUNCA meter a BD dentro da imagem.
#
# Os caminhos dos mounts sao ABSOLUTOS de proposito (convencao do qrcode). O
# compose corre a partir do workspace do Jenkins, por isso `./storage` poria a
# BD de producao dentro de um workspace de CI — que e apagavel e onde cada
# build faz `git checkout -f`. O estado vive fora, em APP_DIR (o mesmo do
# Jenkinsfile); mudar um caminho aqui obriga a mudar o outro.
#
# Redis: EXTERNO, nao nasce daqui. O 12studio usa a instancia partilhada que ja
# existe na rede `Projects` (container `redis`), em vez de correr uma segunda na
# mesma maquina. Nao voltar a por um servico `redis` neste ficheiro.
#
# So o CACHE la vai. Sessions e filas ficam em SQLite — ver o porque, com
# detalhe, no docker/bootstrap-env.sh. Em duas linhas: essa instancia corre
# `--maxmemory-policy allkeys-lru` sem `--appendonly`, portanto despeja chaves
# ao encher e perde tudo num restart. Cache aguenta isso por definicao; uma fila
# nao — os jobs desapareciam sem erro em lado nenhum.
#
# Colisao de chaves com os outros projetos nao e problema: o config/database.php
# poe o prefixo `12studio-database-` em TODAS as connections (bloco `options`).
#
# A instancia tem `--requirepass`, logo o .env do servidor precisa de
# REDIS_PASSWORD — sem ela e NOAUTH em cada pedido.
# (Nunca correr FLUSHALL; o deploy usa `artisan cache:clear`.)

services:
    app:
        image: 12studio:latest
        build: .
        restart: unless-stopped
        # NUNCA montar o public/ (nem o /app) daqui: e o WEB_DOCUMENT_ROOT, e
        # um bind mount tapa — nao funde — o que a imagem traz. O public/ do
        # host chega vazio (bootstrap-env.sh) e escondia o index.php: o
        # `try_files ... /index.php` do nginx e um redirect interno, o pedido
        # ia ao FastCGI na mesma e o php-fpm respondia 404 a TUDO. Os assets
        # ja vem compilados na imagem (stage `build` -> npm run build:ssr) e
        # os uploads vivem em storage/, servidos pelo symlink public/storage.
        # Guardado por tests/Unit/PublicDocumentRootTest.php.
        volumes:
            - /home/cinhos/projects/12studio/app/12studio/.env:/app/.env:ro
            - /home/cinhos/projects/12studio/app/12studio/storage:/app/storage
        networks:
            - Projects
            - nginx_proxy_manager_default

networks:
    # Redes partilhadas da maquina (Jenkins + Nginx Proxy Manager). A `Projects`
    # e tambem por onde o app chega ao Redis externo. Nao ha rede `internal`:
    # existia so para isolar o redis proprio, que deixou de existir.
    Projects:
        external: true
    nginx_proxy_manager_default:
        external: true
