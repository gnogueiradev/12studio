; Servidor SSR do Inertia (porta 13714) — renderiza a montra no servidor
; para SEO. O bundle e construido no Dockerfile (npm run build:ssr).
[program:inertia-ssr]
process_name=%(program_name)s
command=php /app/artisan inertia:start-ssr
directory=/app
autostart=true
autorestart=true
startsecs=3
user=application
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
