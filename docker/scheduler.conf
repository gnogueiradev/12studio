; Scheduler do Laravel via supervisor (nao cron do sistema) — corre os
; agendamentos de routes/console.php: backup diario do SQLite e, a partir
; da Fase 3, o sweep de reservas de stock expiradas.
[program:scheduler]
process_name=%(program_name)s
command=php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
startsecs=3
user=application
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
