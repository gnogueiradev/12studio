# Compressao e cache dos ficheiros do build, dentro do bloco server da
# imagem base (vhost.common.d). O nginx dela vem com o gzip desligado: sem
# isto, o JS e o CSS da montra seguiam por inteiro (~700 KB por pagina) e o
# Lighthouse em telemovel ficava nos 50s.
#
# Nada aqui pode repetir o que a imagem ja declara (ver
# tests/Unit/NginxVhostConfigTest.php).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

# Os ficheiros do Vite levam o hash no nome: podem ficar em cache para
# sempre (um deploy novo muda-lhes o nome).
location ^~ /build/assets/ {
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
