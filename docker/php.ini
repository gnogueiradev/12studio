; Opcache de producao. validate_timestamps=0: o PHP nunca re-verifica os
; ficheiros em disco — maximo desempenho, MAS exige `artisan optimize` +
; restart no deploy (o Jenkinsfile trata disso) e proibe editar codigo
; dentro do container a quente.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Tectos de upload. O nginx aceita 25m (SERVICE_NGINX_CLIENT_MAX_BODY_SIZE no
; Dockerfile) mas o PHP nao estava fixado em lado nenhum, logo ficava nos
; defaults dele: 2M de ficheiro e 8M de corpo. Resultado — um upload de 5M (o
; maximo que o StoreProductImageRequest valida) passava o nginx e morria no PHP
; com um $_FILES vazio e uma mensagem que nao dizia nada.
;
; O post_max_size fica ACIMA do upload_max_filesize para os campos do formulario
; e o overhead do multipart caberem, e ambos abaixo do tecto do nginx: quem
; excede leva um 413 limpo do nginx em vez de um erro mudo do PHP.
;
; Guardado por tests/Unit/PhpUploadLimitsTest.php, que exige que estes numeros
; nao ultrapassem o do nginx — para os dois nunca mais divergirem em silencio.
upload_max_filesize=20M
post_max_size=24M

; Tira o header X-Powered-By, que anuncia a versao exata do PHP a quem procura
; alvos por versao.
expose_php=Off
