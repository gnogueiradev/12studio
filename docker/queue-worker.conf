; Worker das filas Redis. A lista --queue= TEM de bater certo com
; config/queue.php (chave "monitored") — o QueueRoutingTest falha se
; divergirem, para nenhum job ficar numa fila que ninguem le.
; numprocs=1 chega para uma loja pequena (emails); subir com o volume.
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/app
autostart=true
autorestart=true
startsecs=3
user=application
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
